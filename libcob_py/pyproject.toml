# Package manifest for the pure-Python GNU Cobol runtime (libcob_py).
#
# This is the build/packaging descriptor for the Python replacement of the C
# ``libcob`` shared library, created for the C->Python backend refactor
# (AAP sections 0.2.1, 0.4.1, 0.5.3).  It declares a standard ``setuptools``
# build backend and pins the minimum interpreter to CPython 3.11, matching the
# ``COB_PYTHON``/``python3>=3.11`` requirement detected by ``configure.ac`` and
# the ``requires-python`` contract referenced throughout the plan.
#
# HARD CONSTRAINT (AAP 0.5 / 0.7.1): the runtime is *standard library only* and
# therefore declares ZERO runtime dependencies.  ``coverage`` is a development /
# test-only tool (the >=80% coverage gate) and is intentionally NOT a runtime
# dependency; it lives in the optional ``test`` extra below.

[build-system]
# setuptools is the build backend (AAP 0.4.1: "setuptools; name=libcob_py;
# requires-python>=3.11").  wheel is the standard bdist build helper.
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libcob_py"
version = "1.1.0"
description = "Pure-Python standard-library runtime for GNU Cobol (OpenCOBOL) - the libcob C library replacement targeted by the cobc Python backend."
# CPython 3.11+ is the compile-time and runtime engine (AAP 0.5.1); the C
# backend's compiler dependency is replaced by this single interpreter.
requires-python = ">=3.11"
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "GNU Cobol contributors" }]
keywords = ["cobol", "gnucobol", "opencobol", "libcob", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

# AAP 0.5 / 0.7.1: ZERO third-party runtime dependencies (stdlib only:
# decimal, importlib, dbm, sqlite3, curses, py_compile, zipapp, os, struct, io).
dependencies = []

[project.optional-dependencies]
# Development/test-only tooling.  ``coverage`` enforces the >=80% per-module
# line-coverage gate (AAP 0.7.1); ``pytest`` is the test runner.  Neither is a
# runtime dependency of the emitted/executed COBOL programs.
test = ["pytest>=7.0", "coverage>=6.0"]

[tool.setuptools]
# The runtime is a single flat package; ship it as-is.
packages = ["libcob_py"]
# The package lives in the repository root (this manifest is inside the package
# directory), so map the package name to its own directory.
package-dir = { "libcob_py" = "." }

[tool.coverage.run]
# Branch coverage over the runtime package, matching the tests/Makefile.am
# ``check-local`` invocation (AAP 0.7.1 coverage gate).
branch = true
source = ["libcob_py"]

[tool.coverage.report]
# The AAP coverage gate: each module must reach >=80% line coverage.
fail_under = 80
show_missing = true
